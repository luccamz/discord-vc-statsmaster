[package]
name = "vc_stats_master"
version = "0.2.2"
edition = "2021"

[dependencies]
poise = "0.6"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls"] }
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1.0"
